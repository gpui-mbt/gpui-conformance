name: Supplemental actual GPUI scalar anchor margins

on:
  pull_request:
    paths:
      - 'adapters/anchor_margin_rust/**'
      - 'diagnostics/anchor_margin/**'
      - 'tests/test_anchor_margin_diagnostic.py'
      - '.github/workflows/anchor-margin-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-margin-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supplemental-headless-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned evidence schema checker
        run: python3 -m pip install jsonschema==4.26.0
      - name: Check input, trace and corruption contracts without compiling Rust
        run: python3 -m unittest discover -s tests -p 'test_anchor_margin_diagnostic.py' -v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-industries/zed
          ref: 5a5fbe79917971a4d52a96b6ddb04da198a5012e
          path: _build/upstream-source
          persist-credentials: false
      - name: Install pinned compiler and Linux link dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y clang lld cmake pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1
      - name: Build and run actual public GPUI APIs on test platform
        run: |
          set -o pipefail
          mkdir -p _build/anchor-margin-run-logs
          python3 diagnostics/anchor_margin/run.py --online \
            --upstream-source _build/upstream-source \
            --output _build/anchor-margin-evidence \
            2>&1 | tee _build/anchor-margin-run-logs/run.log
      - name: Independently reread retained source, ELF and raw lifecycle events
        run: |
          python3 diagnostics/anchor_margin/verify.py _build/anchor-margin-evidence \
            --suite-commit "$(git rev-parse HEAD)" --suite-tree "$(git rev-parse HEAD^{tree})" \
            --suite-source . --upstream-source _build/upstream-source \
            > _build/anchor-margin-independent-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplemental-anchor-margin-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            _build/anchor-margin-evidence
            _build/anchor-margin-run-logs
            _build/anchor-margin-independent-verification.json
          if-no-files-found: warn
          retention-days: 30
