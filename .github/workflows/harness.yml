name: Portable harness contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate harness contracts without claiming oracle execution
        run: python3 -m unittest discover -s tests -p 'test_portable_contracts.py' -v
      - name: Validate retained image analysis contracts without native execution
        run: python3 -m unittest discover -s tests -p 'test_visual_contracts.py' -v
