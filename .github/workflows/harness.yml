name: Portable harness contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate harness contracts without claiming oracle execution
        run: python3 -m unittest discover -s tests -p 'test_portable_contracts.py' -v
      - name: Validate process-isolated runner with synthetic POSIX suites only
        run: python3 -m unittest discover -s tests -p 'test_contract_test_runner.py' -v
      - name: Validate nested-scroll comparison contracts without claiming runtime parity
        run: python3 -m unittest discover -s tests -p 'test_nested_scroll_pair.py' -v
      - name: Validate align-self differential contracts without claiming runtime parity
        run: python3 -m unittest discover -s tests -p 'test_align_self.py' -v
      - name: Validate flow-relative justification contracts without claiming runtime parity
        run: python3 -m unittest discover -s tests -p 'test_flex_justify.py' -v
      - name: Validate authored-root-box contracts without claiming runtime parity
        run: python3 -m unittest discover -s tests -p 'test_root_box.py' -v
      - name: Validate explicit flex-basis contracts without claiming runtime parity
        run: python3 -m unittest discover -s tests -p 'test_flex_basis.py' -v
      - name: Validate the declared Web TextField/IME corpus
        run: python3 -m unittest discover -s tests -p 'test_ime_scenarios.py' -v
      - name: Run the synthetic Node IME host lane (not a live IME claim)
        run: node --test web/tests/input-ime-host.test.mjs
      - name: Install Pillow needed by image evidence contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: Verify Linux two-window lab contracts without native execution
        run: python3 -m unittest discover -s tests -p 'test_native_lab.py' -v
      - name: Validate retained image analysis contracts without native execution
        run: python3 -m unittest discover -s tests -p 'test_visual_contracts.py' -v
      - name: Validate nonactivating fixture contracts without native execution
        run: python3 -m unittest discover -s tests -p 'test_fixture_contracts.py' -v
      - name: Validate owned observer contracts without native execution
        run: python3 -m unittest discover -s tests -p 'test_observer_contracts.py' -v
      - name: Reject AX application aliases and verify owned cleanup without native execution
        run: python3 -m unittest discover -s tests -p 'test_ax_regression.py' -v

  ax-control-build:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile stock AppKit control and external observer without GUI execution
        run: |
          mkdir -p _build/ax-control-build
          for source in ax_appkit_control native_observer; do
            xcrun clang -fobjc-arc -Wall -Wextra -Werror "adapters/$source.m" \
              -framework AppKit -framework ApplicationServices \
              -o "_build/ax-control-build/$source"
          done

  native-observer-guards:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile native observer and fixture helper without launching them
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror adapters/native_observer.m -framework AppKit -framework ApplicationServices -o "$RUNNER_TEMP/native-observer"
          xcrun clang -dynamiclib -fobjc-arc -Wall -Wextra -Werror adapters/native_moonbit/foreground.m -framework AppKit -o "$RUNNER_TEMP/foreground.dylib"
      - name: Test candidate guards with mocked AX reads and no GUI
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror tests/native_ax_observer_test.m -framework AppKit -framework ApplicationServices -o "$RUNNER_TEMP/native-ax-test"
          "$RUNNER_TEMP/native-ax-test"
