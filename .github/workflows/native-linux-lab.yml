name: Linux native side-by-side GPU qualification

on:
  pull_request:
    paths:
      - native_lab/**
      - adapters/linux_rust/**
      - adapters/linux_moonbit/**
      - native_scenarios.json
      - .github/workflows/native-linux-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x11-native-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Install native X11 and Wayland build/runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git cmake ninja-build \
            python3-pil libx11-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev libxext-dev \
            libxcomposite-dev libxdamage-dev libxcb1-dev libxcb-xkb-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dri mesa-vulkan-drivers libvulkan-dev libfontconfig1-dev \
            libfreetype6-dev libasound2-dev libudev-dev libdbus-1-dev \
            libpango1.0-dev libx11-xcb-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-composite0-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-ewmh-dev \
            xvfb openbox wmctrl imagemagick weston x11-utils
          rustup toolchain install 1.98.1 --profile minimal
          moon version --all
          rustc +1.98.1 --version
      - name: Checkout immutable gpui.rs and gpui.mbt oracle/candidate source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/zed-industries/zed.git zed-source
          git -C zed-source checkout "$(python3 -c 'import json;print(json.load(open("pins.json"))["upstream"]["revision"])')"
          git clone --filter=blob:none --no-checkout https://github.com/gpui-mbt/gpui.mbt.git gpui-reference
          git -C gpui-reference checkout "$(python3 -c 'import json;print(json.load(open("pins.json"))["moonbit"]["revision"])')"
          git -C zed-source status --porcelain
          git -C gpui-reference status --porcelain
      - name: Start owned Xvfb/Openbox and attempt actual concurrent GPU frames
        id: live
        continue-on-error: true
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p _build/native-x11-system
          Xvfb :99 -screen 0 1024x768x24 +extension GLX +render -noreset > _build/native-x11-system/xvfb.log 2>&1 &
          xvfb_pid=$!
          echo "$xvfb_pid" > _build/native-x11-system/xvfb.pid
          trap 'kill "$openbox_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
            sleep .25
          done
          xdpyinfo -display "$DISPLAY" >/dev/null
          openbox > _build/native-x11-system/openbox.log 2>&1 &
          openbox_pid=$!
          echo "$openbox_pid" > _build/native-x11-system/openbox.pid
          for i in $(seq 1 60); do
            if wmctrl -m >/dev/null 2>&1; then break; fi
            sleep .25
          done
          wmctrl -m
          set +e
          python3 native_lab/launcher.py \
            --upstream-source "$GITHUB_WORKSPACE/zed-source" \
            --moonbit-source "$GITHUB_WORKSPACE/gpui-reference" \
            --output "$GITHUB_WORKSPACE/_build/native-lab-actual" \
            --build-timeout 2400 --online
          rc=$?
          echo "result_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Classify observed GPU evidence separately from portable CI
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("_build/native-lab-actual/comparison.json")
          if not path.is_file():
              print("::warning::Linux native GPU run UNVERIFIED: no comparison.json")
          else:
              report = json.loads(path.read_text())
              print(f"Native lab status: {report['status']}")
              for reason in report.get("reasons", []):
                  print(f"  {reason}")
              if report["status"] == "unverified":
                  print("::warning::Linux native GPU is UNVERIFIED, not a passing GPU run")
              if report["status"] == "mismatch":
                  raise SystemExit("Observed native GPU mismatch")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-side-by-side-native-evidence
          path: |
            _build/native-lab-actual/
            _build/native-x11-system/
          if-no-files-found: warn
