name: Browser example ports
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/browser-examples.yml'
      - '.github/workflows/browser-lab-cloudflare.yml'
      - 'wrangler.browser-lab.jsonc'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: browser-examples-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Both jobs consume the same workflow checkout, but neither consumes the
  # other's compiled output. The browser verification job is their sole join.
  moonbit-js:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin immutable source revisions
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open('web/examples.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('gpui=' + p['moonbit']['revision'], file=out)
              print('zed=' + p['upstream']['revision'], file=out)
          PY
      - uses: actions/checkout@v4
        with:
          repository: gpui-mbt/gpui.mbt
          ref: ${{ steps.pins.outputs.gpui }}
          path: _sources/gpui
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: ${{ steps.pins.outputs.zed }}
          path: _sources/zed
          persist-credentials: false
      - name: Install MoonBit and record the actual compiler
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install pinned PNG decoder for host tests and browser evidence
        run: python3 -m pip install Pillow==12.0.0
      - name: Host and catalog contracts
        run: node --test web/tests/*.test.mjs
      - name: Verify immutable candidate source and host packaging
        run: python3 -m unittest discover -s web/tests -p 'test_moonbit_provenance.py' -v
      - name: Compile and unit-test the actual MoonBit port
        run: python3 web/scripts/build_moonbit.py --gpui-source _sources/gpui --upstream-source _sources/zed
      - name: Upload pinned MoonBit site
        uses: actions/upload-artifact@v4
        with:
          name: browser-example-moonbit-site
          path: _build/browser-lab
          if-no-files-found: error
          retention-days: 3

  rust-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin immutable source revisions
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open('web/examples.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('gpui=' + p['moonbit']['revision'], file=out)
              print('zed=' + p['upstream']['revision'], file=out)
          PY
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: ${{ steps.pins.outputs.zed }}
          path: _sources/zed
          persist-credentials: false
      - name: Verify unchanged Rust upstream packaging
        run: python3 -m unittest discover -s web/tests -p 'test_rust_packaging.py' -v
      - name: Install fixed Rust toolchain and matching bindings generator
        run: |
          rustup toolchain install nightly-2026-10-14 --profile minimal --component rust-src --target wasm32-unknown-unknown
          curl -fL --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/bindgen.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/bindgen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _build/rust-target
          key: browser-wasm-${{ runner.os }}-20261014-${{ hashFiles('web/rust/Cargo.lock', 'web/examples.json') }}
      - name: Prepare isolated, unverified Rust site
        run: python3 web/scripts/assemble_browser_lab.py prepare-rust --rust-site _build/rust-browser-lab
      - name: Compile unchanged implemented upstream GPUI examples to WASM
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -o pipefail
          python3 web/scripts/build_rust.py --upstream-source _sources/zed --site _build/rust-browser-lab 2>&1 | tee _build/rust-browser-lab/rust-build.log
      - name: Upload pinned Rust bundle
        uses: actions/upload-artifact@v4
        with:
          name: browser-example-rust-site
          path: _build/rust-browser-lab
          if-no-files-found: error
          retention-days: 3

  matched-examples:
    needs: [moonbit-js, rust-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify artifact assembly rejection controls
        run: python3 -m unittest discover -s web/tests -p 'test_browser_lab_assembly.py' -v
      - name: Download compiled MoonBit site
        uses: actions/download-artifact@v4
        with:
          name: browser-example-moonbit-site
          path: _build/browser-lab
      - name: Download compiled Rust bundle
        uses: actions/download-artifact@v4
        with:
          name: browser-example-rust-site
          path: _build/rust-browser-lab
      - name: Authenticate source pins, compiled bytes and merge both sites
        run: |
          python3 web/scripts/assemble_browser_lab.py merge --moonbit-site _build/browser-lab --rust-site _build/rust-browser-lab
      - name: Install pinned PNG decoder for host tests and browser evidence
        run: python3 -m pip install Pillow==12.0.0
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install OCR for real upstream Prime sieve result verification
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Verify lossless screenshot transport and record decode timings
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
        run: node web/tests/screenshot-rgba-browser.mjs
      - name: Execute both compiled runtimes on one isolated origin
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
        run: |
          node web/tests/candidate-browser.mjs _build/browser-lab --require-rust
          node web/tests/load-timing-browser.mjs
      - name: Capture unchanged Rust scrollable behavior
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
        run: node web/tests/scrollable-oracle-browser.mjs _build/browser-lab
      - name: Capture compiled MoonBit scrollable behavior
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
        run: node web/tests/scrollable-oracle-browser.mjs _build/browser-lab --candidate
      - name: Compare retained scrollable evidence
        run: node web/tests/compare-scrollable-results.mjs _build/browser-example-evidence
      - name: Capture unchanged Rust focus-visible behavior
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
        run: node web/tests/focus-visible-oracle-browser.mjs _build/browser-lab
      - name: Capture compiled MoonBit focus-visible behavior
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
        run: node web/tests/focus-visible-oracle-browser.mjs _build/browser-lab --candidate
      - name: Compare retained focus-visible evidence
        run: node web/tests/compare-focus-visible-results.mjs _build/browser-example-evidence
      - name: Measure screenshot differences without claiming native parity
        run: |
          python3 web/scripts/compare_screenshots.py _build/browser-example-evidence
          python3 web/scripts/compare_text_layout.py _build/browser-example-evidence
          python3 web/scripts/analyze_screenshots.py _build/browser-example-evidence --font _build/browser-lab/moonbit/IBMPlexSans-Regular.ttf --baseline web/evidence/20261015
          python3 -m unittest discover -s web/tests -p 'test_pixel_regions.py' -v
          python3 -m unittest discover -s web/tests -p 'test_text_layout_comparator.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-example-evidence
          path: |
            _build/browser-lab
            _build/browser-example-evidence
          if-no-files-found: warn
