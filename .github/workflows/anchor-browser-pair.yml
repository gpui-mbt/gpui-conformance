name: Anchor actual compiled browser pair
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/anchor-browser-pair.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anchor-browser-pair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-browser-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact source and published candidate pins
        id: pins
        run: |
          python3 - <<'PY'
          import json, os, re
          p = json.load(open('web/pairs/anchor.json'))
          assert re.fullmatch('[0-9a-f]{40}', p['candidate']['revision'] or ''), 'Published core pin is required'
          assert re.fullmatch('[0-9a-f]{40}', p['candidate']['tree'] or '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('core=' + p['candidate']['revision'], file=out)
              print('zed=' + p['upstream']['revision'], file=out)
          PY
      - uses: actions/checkout@v4
        with:
          repository: gpui-mbt/gpui.mbt
          ref: ${{ steps.pins.outputs.core }}
          path: _sources/core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: ${{ steps.pins.outputs.zed }}
          path: _sources/zed
          persist-credentials: false
      - name: Install MoonBit and fixed original-PNG decoder
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          python3 -m pip install Pillow==12.0.0
      - name: Run host/comparator regressions and packaging tests
        run: |
          node --test --test-concurrency=1 web/tests/anchor*.test.mjs
          python3 -m unittest discover -s web/tests -p 'test_anchor*.py' -v
          python3 -m unittest discover -s web/tests -p 'test_rust_packaging.py' -v
          python3 -m unittest discover -s web/tests -p 'test_rust_subset.py' -v
      - name: Compile genuine MoonBit candidate and retain exact core/source/toolchain inputs
        run: |
          mkdir -p _build/anchor-pair-evidence
          python3 web/scripts/build_anchor_pair.py --gpui-source _sources/core --upstream-source _sources/zed --out _build/anchor-candidate 2>&1 | tee _build/anchor-pair-evidence/moonbit-build.log
          GPUI_ANCHOR_RUNTIME="$PWD/_build/anchor-candidate/moonbit/anchor.mjs" node --test web/tests/anchor-candidate-runtime.test.mjs web/tests/anchor-live-runtime.test.mjs
      - name: Prepare isolated unchanged Rust site
        run: python3 web/scripts/prepare_anchor_site.py --out _build/anchor-rust-site
      - name: Install fixed Rust toolchain and binding generator
        run: |
          rustup toolchain install nightly-2026-10-14 --profile minimal --component rust-src --target wasm32-unknown-unknown
          curl -fL --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/bindgen.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/bindgen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _build/anchor-rust-target
          key: anchor-pair-rust-${{ runner.os }}-20261014-${{ steps.pins.outputs.zed }}-${{ hashFiles('web/rust/Cargo.lock') }}
      - name: Build exact unchanged source5a oracle
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          mkdir -p _build/anchor-oracle-evidence
          python3 web/scripts/build_rust.py --upstream-source _sources/zed --site _build/anchor-rust-site --target-dir _build/anchor-rust-target --oracle-only --extra-example anchor 2>&1 | tee _build/anchor-oracle-evidence/rust-build.log
      - name: Install pinned Chromium runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise embedded live anchor viewport, DPR, hover, clipping and recovery
        timeout-minutes: 5
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
          BROWSER_EVIDENCE: _build/anchor-live-evidence
        run: node web/tests/anchor-live-browser.mjs _build/anchor-candidate
      - name: Independently capture and verify actual unchanged Rust
        id: rust_capture
        timeout-minutes: 20
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
          BROWSER_EVIDENCE: _build/anchor-oracle-evidence
        run: |
          node web/tests/anchor-oracle-browser.mjs _build/anchor-rust-site
          node web/tests/verify-anchor-results.mjs _build/anchor-oracle-evidence
      - name: Independently capture compiled MoonBit through the same 41 hover/viewport states
        id: candidate_capture
        timeout-minutes: 15
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
          BROWSER_EVIDENCE: _build/anchor-pair-evidence
        run: node web/tests/anchor-pair-browser.mjs _build/anchor-candidate _build/anchor-oracle-evidence
      - name: Reopen original runtime, worker, source, input and PNG evidence and compare
        id: ordinary_pair
        if: ${{ always() && (steps.candidate_capture.outcome == 'success' || steps.candidate_capture.outcome == 'failure') }}
        timeout-minutes: 15
        run: node web/tests/verify-anchor-pair.mjs _build/anchor-pair-evidence _build/anchor-oracle-evidence _sources/core
      - name: Compile and actually execute wrong-geometry and wrong-color controls
        if: ${{ always() && steps.ordinary_pair.outcome == 'success' }}
        timeout-minutes: 30
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
        run: python3 web/scripts/run_anchor_pair_controls.py --gpui-source _sources/core --upstream-source _sources/zed --rust-evidence _build/anchor-oracle-evidence --out _build/anchor-executed-controls --ordinary-evidence _build/anchor-pair-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-actual-compiled-browser-pair
          path: |
            _build/anchor-candidate
            _build/anchor-rust-site
            _build/anchor-pair-evidence
            _build/anchor-oracle-evidence
            _build/anchor-executed-controls
            _build/anchor-live-evidence
          if-no-files-found: warn
