name: Supplemental static image resource pair

on:
  pull_request:
    paths:
      - 'adapters/image_resource_rust/**'
      - 'assets/app-icon.png'
      - 'assets/portrait.png'
      - 'web/moonbit/site/render.mjs'
      - 'web/moonbit/site/image-resources.mjs'
      - 'web/tests/image-resources.test.mjs'
      - 'adapters/image_resource_moonbit/**'
      - 'diagnostics/image_resource_pair/**'
      - 'tests/test_image_resource_pair.py'
      - '.github/workflows/image-resource-pair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-resource-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-image-resource-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed unless reviewed core is bound
        id: pin
        run: |
          python3 - <<'PY'
          import json, os, re
          p=json.load(open('diagnostics/image_resource_pair/profile.json'))
          assert p['status']=='bound'
          assert all(isinstance(p[k],str) and re.fullmatch('[0-9a-f]{40}',p[k]) for k in ('core_commit','core_tree'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              print('core='+p['core_commit'],file=stream)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gpui-mbt/gpui.mbt
          ref: ${{ steps.pin.outputs.core }}
          path: _build/core-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-industries/zed
          ref: 5a5fbe79917971a4d52a96b6ddb04da198a5012e
          path: _build/zed-source
          persist-credentials: false
      - name: Check source contracts
        run: |
          set -o pipefail
          mkdir -p _build/image-resource-logs
          python3 -m unittest discover -s tests -p test_image_resource_pair.py -v 2>&1 | tee _build/image-resource-logs/source-tests.log
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
      - name: Verify exact core scene and element interfaces
        id: interfaces
        continue-on-error: true
        run: |
          set -o pipefail
          failed=0
          for package in scene element; do
            expected="_build/core-source/$package/pkg.generated.mbti"
            cp "$expected" "_build/image-resource-logs/core-$package.expected.mbti" || failed=1
            sha256sum "$expected" > "_build/image-resource-logs/core-$package-source-before.sha256" || failed=1
            (cd _build/core-source && moon info --target native --package "f4ah6o/gpui/$package") > "_build/image-resource-logs/core-$package-info.log" 2>&1 || failed=1
            generated="_build/core-source/_build/native/debug/check/$package/$package.mbti"
            cp "$generated" "_build/image-resource-logs/core-$package.generated.mbti" || failed=1
            sha256sum "$expected" > "_build/image-resource-logs/core-$package-source-after.sha256" || failed=1
            cmp "_build/image-resource-logs/core-$package-source-before.sha256" "_build/image-resource-logs/core-$package-source-after.sha256" || failed=1
            sha256sum "$generated" > "_build/image-resource-logs/core-$package-generated.sha256" || failed=1
            diff -u "_build/image-resource-logs/core-$package.expected.mbti" "_build/image-resource-logs/core-$package.generated.mbti" > "_build/image-resource-logs/core-$package-interface.diff" || failed=1
          done
          exit "$failed"
      - name: Install Rust and Linux link dependencies with process logs
        run: |
          python3 - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0,'diagnostics/image_resource_pair')
          from support import execute,save,require
          require(min(shutil.disk_usage('.').free,shutil.disk_usage('/tmp').free)>=9*1024**3,'9GiB headroom')
          out=Path('_build/image-resource-logs')
          for name,cmd in [
              ('rust-install',['rustup','toolchain','install','1.98.1','--profile','minimal']),
              ('apt-update',['sudo','apt-get','update']),
              ('apt-install',['sudo','apt-get','install','-y','clang','lld','cmake','pkg-config','libasound2-dev','libfontconfig-dev','libglib2.0-dev','libssl-dev','libwayland-dev','libx11-xcb-dev','libxkbcommon-x11-dev','libvulkan1'])]:
              record=execute(cmd,out,name,os.environ.copy(),timeout=900,cwd=Path.cwd())
              save(out/(name+'.json'),record)
              require(record['returncode']==0 and not record['timed_out'] and not record['resource_floor_breached'],'setup failed: '+name)
          PY
      - name: Install pinned browser tooling
        run: |
          npm install --prefix _build/image-playwright --no-audit --no-fund playwright@1.56.1
          _build/image-playwright/node_modules/.bin/playwright install --with-deps chromium
          echo "PLAYWRIGHT_ROOT=$GITHUB_WORKSPACE/_build/image-playwright" >> "$GITHUB_ENV"
      - name: Check browser source contracts
        run: node --test web/tests/image-resources.test.mjs web/tests/scene-opacity.test.mjs
      - name: Execute fresh Rust, core and browser controls
        run: |
          set -o pipefail
          python3 diagnostics/image_resource_pair/run.py \
            --core-source _build/core-source --upstream-source _build/zed-source \
            --output _build/image-resource-pair 2>&1 | tee _build/image-resource-logs/run.log
      - name: Require core interface gate
        if: always() && steps.pin.outcome == 'success'
        run: test "${{ steps.interfaces.outcome }}" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-resource-pair-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/image-resource-pair
            _build/image-resource-logs
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
