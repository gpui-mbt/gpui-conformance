name: Test catalog Pages

on:
  pull_request:
    paths:
      - '.github/workflows/catalog-pages.yml'
      - 'catalog/**'
      - 'scripts/build_test_catalog.py'
      - 'tests/test_catalog_site.py'
      - 'tests/catalog-browser.mjs'
      - 'scenarios.json'
      - '*_scenarios.json'
      - 'results/cross-axis-limits-linux-x86_64-20261015.json'
      - 'results/native-merged-macos-arm64-20261014.json'
      - 'native_observer_status.json'
      - 'pins.json'
      - 'web/examples.json'
      - 'web/evidence/20261016/result.json'
      - 'web/evidence/20261016-text-examples/**'
      - 'web/PIXEL_ANALYSIS_20261016.md'
      - 'web/README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-pages.yml'
      - 'catalog/**'
      - 'scripts/build_test_catalog.py'
      - 'tests/test_catalog_site.py'
      - 'tests/catalog-browser.mjs'
      - 'scenarios.json'
      - '*_scenarios.json'
      - 'results/cross-axis-limits-linux-x86_64-20261015.json'
      - 'results/native-merged-macos-arm64-20261014.json'
      - 'native_observer_status.json'
      - 'pins.json'
      - 'web/examples.json'
      - 'web/evidence/20261016/result.json'
      - 'web/evidence/20261016-text-examples/**'
      - 'web/PIXEL_ANALYSIS_20261016.md'
      - 'web/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate catalog from registered scenarios and retained evidence
        # Optional repository variable; leave unset until the deployed worker URL is verified.
        env:
          CATALOG_BROWSER_LAB_BASE_URL: ${{ vars.CATALOG_BROWSER_LAB_BASE_URL }}
        run: python3 scripts/build_test_catalog.py
      - name: Validate generated catalog and evidence qualifications
        run: python3 -m unittest discover -s tests -p 'test_catalog_site.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install catalog browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify atomic catalog and legacy cache recovery in a browser
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pw
          CATALOG_BROWSER_LAB_BASE_URL: ${{ vars.CATALOG_BROWSER_LAB_BASE_URL }}
        run: node tests/catalog-browser.mjs _build/catalog
      - name: Upload the static catalog only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _build/catalog

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
