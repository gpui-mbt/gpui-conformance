name: Browser lab Cloudflare (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-lab-cloudflare
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feat/browser-side-by-side-lab'
    uses: ./.github/workflows/browser-examples.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: browser-lab-cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: browser-example-evidence
          path: _artifacts
      - name: Require both verified compiled runtimes
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path('_artifacts')
          result = json.loads((root / 'browser-example-evidence/result.json').read_text())
          assert result['overall'] == 'passed'
          assert result['candidate'] == result['rust'] == 'passed'
          assert result['raster_comparison']['width'] == 500
          shutil.copytree(root / 'browser-lab', '_build/browser-lab')
          PY
      - name: Publish isolated same-origin lab to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.browser-lab.jsonc
